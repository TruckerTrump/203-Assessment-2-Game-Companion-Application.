<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Tab</title>
    <link rel="stylesheet" href="css/Bank.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="container">
        <header class="header">
            <h1>Bank</h1>
            <p>Move items between bank and self.</p>
        </header>
        <main class="trading-section">
            <div class="inventory-panel player-panel">
                <h2>Player Inventory</h2>
                <ul class="item-list">
                    <li v-for="item in playerInventory"
                    :key="item.id" class="item-name">
                    <span class="item-name">{{ item.name}}</span>
                    <button class="transfer-btn to-bank"
                    @click="moveToBank(item)">To Bank.</button>
                    </li>
                </ul>
            </div>

            <div class="inventory-panel bank-panel">
                <h2>Bank Storage.</h2>
                <ul class="item-list">
                    <li v-for="item in bankInventory" 
                    :key="item.id" class="item">
                    <span class="item-name">{{ item.name }}</span>
                    <button class="transfer-btn to-player"
                    @click="moveToPlayer(item)">To Player</button>
                    </li>
                </ul>
            </div>
        </main>

        <footer class="footer">
            <button class="action-btn reset trade"
            @click="resetInventories">Reset</button>
        </footer>
    </div>

    <script>
        const { createApp } =Vue;

        createApp({
            data() {
                return {
                    // Players inventory items
                    playerInventory: [
                        {id: 'sword' , name: 'Sword' , quantity: 1},
                        {id: 'potion' , name: 'Health Potion' , quantity: 1}
                    ],
                    // Bank Inventory Items
                    bankInventory: [
                        { id: 'gold' , name: 'Gold Coins' , quantity: 1},

                    ]
                };
            },
            methods: {
                // Move items from player to bank
                moveToBank(item) {
                    //Remove item from player inventory
                    this.playerInventory = this.playerInventory.
                    filter(i=> i.id !==item.id);
                    //Add item to players inventory.
                    this.bankInventory.push(item);
                },
                // Move items from bank to player
                moveToPlayer(item) {
                    //Remove items from bank inventory
                    this.bankInventory = this.bankInventory.
                    filter(i => i.id !== item.id);
                    // Add them to player inventory
                    this.playerInventory.push(item);
                },
                //Reset inventories to starting state.
                resetInventories() {
                    this.playerInventory = [
                        {id: 'sword' , name: 'Sword' , quantity: 1},
                        {id: 'potion' , name: 'Health Potion' , quantity: 1}
                    ];
                    this.bankInventory = [
                        { id: 'gold' , name: 'Gold Coins' , quantity: 1},
                    ];
                    alert('Inventories reset');
                }
            }
        }) .mount('#app');
    </script>
</body>
</html>
